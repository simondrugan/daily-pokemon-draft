name: Test and deploy

# - Every push and pull request runs the tests (the "test" check).
# - A push to main publishes the site, after the tests pass.
# - A pull request from this repository gets a playable preview at
#   <site>/pr-preview/pr-<number>/, linked in a comment and removed when the PR closes.
# Pages must be set to "Deploy from a branch: gh-pages / (root)" (see docs/WORKFLOW.md).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/publish-pages.sh site

  preview:
    # Previews of branches from forks are skipped: their runs cannot write to this repository.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bash tools/publish-pages.sh preview "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Comment with the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          case "$base" in http*) ;; *) base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" ;; esac
          url="${base%/}/pr-preview/pr-$PR/"
          body="<!-- pr-preview -->
          **Preview:** $url

          Updated for ${SHA:0:7}. A new push can take a minute or two to appear; refresh if you see the old version."
          bash tools/pr-comment.sh "$PR" "$body"

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: bash tools/publish-pages.sh remove "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bash tools/pr-comment.sh "$PR" "<!-- pr-preview -->
          **Preview removed** because this pull request was closed." --only-update
